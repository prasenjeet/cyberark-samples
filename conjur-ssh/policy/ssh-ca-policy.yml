---
# =============================================================================
# Conjur SSH CA Policy
# ssh-ca-policy.yml
#
# Defines the SSH Certificate Authority components in Conjur:
#   - The CA signing key (stored securely in Conjur)
#   - The CA public key (distributed to target SSH servers)
#   - Groups that are permitted to request certificates
#   - A template for certificate content
#
# Load with:
#   conjur policy load -b root -f ssh-ca-policy.yml
# =============================================================================

- !policy
  id: ssh
  annotations:
    description: CyberArk Conjur SSH Certificate Authority

  body:

    # -------------------------------------------------------------------------
    # SSH CA Variables
    # The private signing key is auto-generated by setup_ca.sh after
    # the policy is loaded. It never leaves Conjur.
    # -------------------------------------------------------------------------
    - !variable
      id: ca/private-key
      annotations:
        description: Ed25519 private key used to sign SSH user certificates

    - !variable
      id: ca/public-key
      annotations:
        description: Corresponding CA public key — distribute to target hosts

    # -------------------------------------------------------------------------
    # Certificate configuration
    # -------------------------------------------------------------------------
    - !variable
      id: ca/certificate-ttl
      annotations:
        description: "Default TTL for issued certificates (e.g., 8h, 1d)"

    # -------------------------------------------------------------------------
    # Groups: who may request certificates
    # -------------------------------------------------------------------------
    - !group
      id: certificate-requesters
      annotations:
        description: Members may request SSH certificates from this CA

    - !group
      id: ca-administrators
      annotations:
        description: Members may rotate the CA key and view audit logs

    # -------------------------------------------------------------------------
    # Permissions
    # -------------------------------------------------------------------------
    - !permit
      role: !group certificate-requesters
      privileges: [read, execute]
      resources:
        - !variable ca/private-key
        - !variable ca/public-key
        - !variable ca/certificate-ttl

    - !permit
      role: !group ca-administrators
      privileges: [read, update, execute]
      resources:
        - !variable ca/private-key
        - !variable ca/public-key
        - !variable ca/certificate-ttl

# =============================================================================
# Target Host Groups
# Groups used in the certificate "principals" field — the SSH server
# grants access to any principal listed in the cert.
# =============================================================================

- !group
  id: ssh/principals/web-servers
  annotations:
    description: Principal for access to web server hosts

- !group
  id: ssh/principals/database-servers
  annotations:
    description: Principal for access to database hosts

- !group
  id: ssh/principals/network-devices
  annotations:
    description: Principal for access to network device management

- !group
  id: ssh/principals/all-servers
  annotations:
    description: Broad principal — use only for break-glass / emergency access
