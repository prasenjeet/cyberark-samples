; =============================================================================
; CyberArk CPM Plugin — Juniper JunOS SSH
; Plugin.ini
; =============================================================================

[Main]
CPMPluginVersion=1.0
AllowedSafes=.*
Name=Juniper JunOS SSH Password Manager

[PolicySettings]
MinValidityPeriod=1
ResetOveridesMinValidity=Yes
ResetOveridesTimeFrame=Yes
HeadStartInterval=5
FromHour=0
ToHour=23
MaxNumberOfRetries=3
MinDelayBetweenRetries=60

[PasswordPolicy]
; JunOS accepts most printable ASCII characters in passwords.
; Avoid characters that interfere with the CLI: $ % { } \ and space.
AllowedCharacters=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#^()_+-=:;,.?/!
MinLength=10
MaxLength=20
MinUpperCase=1
MinLowerCase=1
MinDigit=1
MinSpecial=1

[AccountDefinition]
UserName=Required
Address=Required
Port=Optional:22

[Capabilities]
CPMChange=Yes
CPMVerify=Yes
CPMReconcile=Yes
