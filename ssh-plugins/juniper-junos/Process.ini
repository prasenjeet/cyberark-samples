; =============================================================================
; CyberArk CPM Plugin — Juniper JunOS SSH
; Process.ini
;
; JunOS CLI prompt patterns:
;   user@host>         — operational mode
;   user@host#         — configuration mode (after "configure")
;   [edit]             — configuration mode indicator in banners
;   commit complete    — successful commit confirmation
; =============================================================================

[GENERAL]
BackslashUsedAsEscape=No
CommandTimeout=45
ConnectionTimeout=15

; =============================================================================
; VERIFY
; =============================================================================

[VERIFYSSH]
; Connect using the managed account's current credentials.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=[>#]

; Run a harmless operational command to confirm access.
2=show version | match Junos
ExpectedOutput2=Junos

3=exit

[VERIFYSSH_PROMPT]
Password=yes

; =============================================================================
; CHANGE
; =============================================================================

[CHANGESSH]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=[\$>]

; Enter configuration mode.
2=configure
ExpectedOutput2=[#\[]

; Set the new plain-text password. JunOS will hash it automatically.
; The "secret" keyword accepts clear-text and stores it as $6$ SHA-512.
3=set system login user %UserName% authentication plain-text-password
ExpectedOutput3=New password

4=%NewPassword%
ExpectedOutput4=Retype new password

5=%NewPassword%
ExpectedOutput5=[#\[]

; Commit the change and return to operational mode in one step.
6=commit and-quit
ExpectedOutput6=commit complete

7=exit

[CHANGESSH_PROMPT]
Password=yes

; =============================================================================
; RECONCILE
; =============================================================================

[RECONCILESSH]
; Connect as the privileged reconcile account (must have super-user class).
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=[\$>]

2=configure
ExpectedOutput2=[#\[]

; Reset the managed account password.
3=set system login user %UserName% authentication plain-text-password
ExpectedOutput3=New password

4=%NewPassword%
ExpectedOutput4=Retype new password

5=%NewPassword%
ExpectedOutput5=[#\[]

6=commit and-quit
ExpectedOutput6=commit complete

7=exit

[RECONCILESSH_PROMPT]
Password=yes

[LOGOFFSSH]
1=exit
