; =============================================================================
; CyberArk CPM Plugin — Linux/Unix SSH
; Plugin.ini
;
; Defines plugin metadata, password composition policy, and operational
; settings consumed by the Central Policy Manager.
; =============================================================================

[Main]
; Plugin schema version — must match the CPM engine expectation.
CPMPluginVersion=1.0

; Regex of Safes this plugin is permitted to manage.
; Use ".*" to allow all safes, or restrict to a specific naming pattern.
AllowedSafes=.*

; Human-readable name shown in logs and the PVWA platform editor.
Name=Unix SSH Password Manager

[PolicySettings]
; Minimum hours a password must remain valid before CPM may rotate it.
MinValidityPeriod=1

; Allow a manual reset to override MinValidityPeriod.
ResetOveridesMinValidity=Yes

; Allow a manual reset to bypass the scheduled time window.
ResetOveridesTimeFrame=Yes

; Hours before expiry at which CPM proactively changes the password.
HeadStartInterval=5

; Number of days until the password must be changed.
FromHour=0
ToHour=23

; Retry policy — how many times CPM retries a failed operation.
MaxNumberOfRetries=5
MinDelayBetweenRetries=30

[PasswordPolicy]
; Characters allowed in generated passwords.
; Excludes shell metacharacters that break passwd interactions: \ " ' ` $ ! & | < >
AllowedCharacters=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#%^()_+-={}[]:;,.?/

; Minimum and maximum password length.
MinLength=12
MaxLength=20

; Complexity requirements.
MinUpperCase=1
MinLowerCase=1
MinDigit=1
MinSpecial=1

[AccountDefinition]
; Properties CPM reads from the account object in the Vault.
; These map to %Parameter% substitution tokens used in Process.ini.
UserName=Required
Address=Required
Port=Optional:22
LogonDomain=Optional
ExtraPass1Name=Optional
ExtraPass1Folder=Optional
ExtraPass1Safe=Optional

[Capabilities]
; Declare which CPM operations this plugin supports.
CPMChange=Yes
CPMVerify=Yes
CPMReconcile=Yes
