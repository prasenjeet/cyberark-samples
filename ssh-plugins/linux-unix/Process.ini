; =============================================================================
; CyberArk CPM Plugin — Linux/Unix SSH
; Process.ini
;
; Defines the SSH session command sequences executed by CPM for each
; operation. Commands are interpreted by the CPM SSH engine, not a shell.
;
; Parameter substitution tokens (resolved at runtime from the Vault account):
;   %Address%           — target host IP or FQDN
;   %Port%              — SSH port (default 22 from Plugin.ini)
;   %UserName%          — account username to manage
;   %Password%          — current (old) password for the managed account
;   %NewPassword%       — newly generated password CPM will set
;   %ExtraPass1%        — credential of reconcile account 1 (password or SSH key PEM)
;   %ExtraPass1Name%    — username of reconcile account 1
;   %ExtraPass2%        — credential of reconcile account 2
;   %ExtraPass2Name%    — username of reconcile account 2
;   %ExtraPass3%        — credential of reconcile account 3
;   %ExtraPass3Name%    — username of reconcile account 3
;   %ExtraPass1AuthMethod% — "Password" or "Key" (from Plugin.ini AccountDefinition)
;
; RECONCILE SECTION SELECTION GUIDE
; ----------------------------------
; Choose the reconcile section that matches your environment and configure it
; as the active reconcile process in the Platform editor (PVWA):
;
;   RECONCILESSH           — ExtraPass1, password auth   (default / backward-compat)
;   RECONCILESSH_KEY1      — ExtraPass1, SSH key auth
;   RECONCILESSH_KEY2      — ExtraPass2, SSH key auth    (use when acct 1 is unavailable)
;   RECONCILESSH_KEY3      — ExtraPass3, SSH key auth    (break-glass)
;   RECONCILESSH_PASS2     — ExtraPass2, password auth   (fallback)
;   RECONCILESSH_PASS3     — ExtraPass3, password auth   (break-glass fallback)
;   RECONCILESSH_MULTIKEY  — Tries all configured accounts automatically via dispatcher
; =============================================================================

[GENERAL]
; Set to Yes when the target system uses backslash as an escape character.
BackslashUsedAsEscape=No

; Timeout (seconds) waiting for an expected SSH prompt before failing.
CommandTimeout=30

; Timeout (seconds) for the initial TCP connection.
ConnectionTimeout=10

; =============================================================================
; VERIFY — Confirms the stored password is valid.
; CPM logs in with the managed account credentials and checks for success.
; =============================================================================

[VERIFYSSH]
; Connect using the managed account's current password.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%

; Expect a shell prompt after successful authentication.
; The regex matches common prompt patterns: $, #, >, or ].
ExpectedOutput1=[\$#>\]]

; Run a benign command to confirm shell access.
2=echo "cyberark-verify-ok"
ExpectedOutput2=cyberark-verify-ok

; Clean disconnect.
3=exit

[VERIFYSSH_PROMPT]
Password=yes

; =============================================================================
; CHANGE — Generates a new password and applies it on the target.
; =============================================================================

[CHANGESSH]
; Connect using the managed account's current (soon to be old) password.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=[\$#>\]]

; Invoke passwd for the managed account.
2=passwd
ExpectedOutput2=(current|old).*[Pp]assword

; Supply the current password when prompted.
3=%Password%
ExpectedOutput3=[Nn]ew.*[Pp]assword

; Supply the new generated password.
4=%NewPassword%
ExpectedOutput4=(Retype|again|[Cc]onfirm).*[Nn]ew.*[Pp]assword

; Confirm the new password.
5=%NewPassword%
ExpectedOutput5=updated|changed|successfully

; Clean disconnect.
6=exit

[CHANGESSH_PROMPT]
Password=yes

; =============================================================================
; RECONCILE — Password-based (ExtraPass1). Default, backward-compatible.
; =============================================================================

[RECONCILESSH]
; Connect as the privileged reconcile account using its Vault password.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=[\$#>\]]

; Reset the managed account password. Tries chpasswd first (non-interactive),
; then falls back to passwd --stdin for RHEL/CentOS environments.
2=bash /tmp/.cark_recon.sh %UserName% %NewPassword%
ExpectedOutput2=SUCCESS

; Clean disconnect.
3=exit

[RECONCILESSH_PROMPT]
Password=yes

; =============================================================================
; RECONCILESSH_KEY1 — SSH key auth via ExtraPass1 (primary key account).
;
; HOW SSH KEY AUTH WORKS IN THIS PLUGIN
; The CPM engine writes the PEM content of %ExtraPass1% to a temporary key
; file before establishing the connection. The temp file is created with 0600
; permissions and deleted immediately after the session closes.
; ExtraPass1 in the Vault must contain the full PEM private key content.
; =============================================================================

[RECONCILESSH_KEY1]
; Connect using the SSH private key stored in ExtraPass1.
; The CPM engine automatically uses the key from ExtraPass1 when AuthType=Key.
AuthType=Key
ExtraPassIndex=1
1=#ssh# -T -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=[\$#>\]]

; Execute the reconcile helper script (uploaded during deployment).
2=bash /tmp/.cark_recon.sh %UserName% %NewPassword%
ExpectedOutput2=SUCCESS

3=exit

[RECONCILESSH_KEY1_PROMPT]
Password=no

; =============================================================================
; RECONCILESSH_KEY2 — SSH key auth via ExtraPass2 (first key fallback).
; Use when ExtraPass1 is unavailable or its key has been rotated out.
; =============================================================================

[RECONCILESSH_KEY2]
AuthType=Key
ExtraPassIndex=2
1=#ssh# -T -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -p %Port% %ExtraPass2Name%@%Address%
ExpectedOutput1=[\$#>\]]

2=bash /tmp/.cark_recon.sh %UserName% %NewPassword%
ExpectedOutput2=SUCCESS

3=exit

[RECONCILESSH_KEY2_PROMPT]
Password=no

; =============================================================================
; RECONCILESSH_KEY3 — SSH key auth via ExtraPass3 (break-glass key account).
; Reserved for emergency access when accounts 1 and 2 are both unavailable.
; =============================================================================

[RECONCILESSH_KEY3]
AuthType=Key
ExtraPassIndex=3
1=#ssh# -T -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -p %Port% %ExtraPass3Name%@%Address%
ExpectedOutput1=[\$#>\]]

2=bash /tmp/.cark_recon.sh %UserName% %NewPassword%
ExpectedOutput2=SUCCESS

3=exit

[RECONCILESSH_KEY3_PROMPT]
Password=no

; =============================================================================
; RECONCILESSH_PASS2 — Password auth via ExtraPass2 (password fallback).
; Use when ExtraPass1 is a key account but ExtraPass2 is password-based.
; =============================================================================

[RECONCILESSH_PASS2]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass2Name%@%Address%
ExpectedOutput1=[\$#>\]]

2=bash /tmp/.cark_recon.sh %UserName% %NewPassword%
ExpectedOutput2=SUCCESS

3=exit

[RECONCILESSH_PASS2_PROMPT]
Password=yes

; =============================================================================
; RECONCILESSH_PASS3 — Password auth via ExtraPass3 (break-glass password).
; =============================================================================

[RECONCILESSH_PASS3]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass3Name%@%Address%
ExpectedOutput1=[\$#>\]]

2=bash /tmp/.cark_recon.sh %UserName% %NewPassword%
ExpectedOutput2=SUCCESS

3=exit

[RECONCILESSH_PASS3_PROMPT]
Password=yes

; =============================================================================
; RECONCILESSH_MULTIKEY — Automatic multi-account dispatcher.
;
; Calls reconcile_dispatcher.sh (on the CPM server) which iterates over all
; configured ExtraPass accounts and auth methods in priority order:
;   1. ExtraPass1 (Key if ExtraPass1AuthMethod=Key, else Password)
;   2. ExtraPass2 (fallback)
;   3. ExtraPass3 (break-glass)
;
; The dispatcher logs each attempt to the CPM log and returns only after
; all accounts have been tried or one succeeds.
;
; Requires: scripts/reconcile_dispatcher.sh deployed to the CPM server at
;   C:\Program Files (x86)\CyberArk\Password Manager\Plugins\UnixSSH\scripts\
; =============================================================================

[RECONCILESSH_MULTIKEY]
; The dispatcher runs locally on the CPM server and handles its own SSH
; connections to the target, so no #ssh# directive is used here.
; CPM invokes the dispatcher as a pre-process step.
PreCommandScript=reconcile_dispatcher.sh
PreCommandArgs=%Address% %Port% %UserName% %NewPassword% %ExtraPass1Name% %ExtraPass1% %ExtraPass1AuthMethod% %ExtraPass2Name% %ExtraPass2% %ExtraPass2AuthMethod% %ExtraPass3Name% %ExtraPass3% %ExtraPass3AuthMethod%
ExpectedPreCommandOutput=RECON_SUCCESS

; No SSH session needed — the dispatcher handles the full connection.
; This section serves as the CPM control point for logging and retry.

[RECONCILESSH_MULTIKEY_PROMPT]
Password=no

; =============================================================================
; LOGOFF — Shared cleanup sequence appended to each operation on failure.
; =============================================================================

[LOGOFFSSH]
1=exit
