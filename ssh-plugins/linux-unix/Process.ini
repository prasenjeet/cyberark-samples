; =============================================================================
; CyberArk CPM Plugin — Linux/Unix SSH
; Process.ini
;
; Defines the SSH session command sequences executed by CPM for each
; operation. Commands are interpreted by the CPM SSH engine, not a shell.
;
; Parameter substitution tokens (resolved at runtime from the Vault account):
;   %Address%        — target host IP or FQDN
;   %Port%           — SSH port (default 22 from Plugin.ini)
;   %UserName%       — account username to manage
;   %Password%       — current (old) password for the managed account
;   %NewPassword%    — newly generated password CPM will set
;   %ExtraPass1%     — password of the reconcile/privileged account
;   %ExtraPass1Name% — username of the reconcile/privileged account
; =============================================================================

[GENERAL]
; Set to Yes when the target system uses backslash as an escape character.
BackslashUsedAsEscape=No

; Timeout (seconds) waiting for an expected SSH prompt before failing.
CommandTimeout=30

; Timeout (seconds) for the initial TCP connection.
ConnectionTimeout=10

; =============================================================================
; VERIFY — Confirms the stored password is valid.
; CPM logs in with the managed account credentials and checks for success.
; =============================================================================

[VERIFYSSH]
; Connect using the managed account's current password.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%

; Expect a shell prompt after successful authentication.
; The regex matches common prompt patterns: $, #, >, or ].
ExpectedOutput1=[\$#>\]]

; Run a benign command to confirm shell access.
2=echo "cyberark-verify-ok"
ExpectedOutput2=cyberark-verify-ok

; Clean disconnect.
3=exit

[VERIFYSSH_PROMPT]
Password=yes

; =============================================================================
; CHANGE — Generates a new password and applies it on the target.
; =============================================================================

[CHANGESSH]
; Connect using the managed account's current (soon to be old) password.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=[\$#>\]]

; Invoke passwd for the managed account.
2=passwd
ExpectedOutput2=(current|old).*[Pp]assword

; Supply the current password when prompted.
3=%Password%
ExpectedOutput3=[Nn]ew.*[Pp]assword

; Supply the new generated password.
4=%NewPassword%
ExpectedOutput4=(Retype|again|[Cc]onfirm).*[Nn]ew.*[Pp]assword

; Confirm the new password.
5=%NewPassword%
ExpectedOutput5=updated|changed|successfully

; Clean disconnect.
6=exit

[CHANGESSH_PROMPT]
Password=yes

; =============================================================================
; RECONCILE — Uses a privileged account to reset the managed account password.
; Used when the managed account password is unknown or expired.
; =============================================================================

[RECONCILESSH]
; Connect as the privileged reconcile account (e.g., root or an admin with sudo).
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=[\$#>\]]

; Use passwd to reset the managed account without needing the old password.
; Root can change any account password non-interactively via stdin.
2=echo -e "%NewPassword%\n%NewPassword%" | passwd %UserName%
ExpectedOutput2=updated|changed|successfully

; Alternatively, for systems where the above fails, use chpasswd:
; 2=echo "%UserName%:%NewPassword%" | chpasswd
; ExpectedOutput2=[\$#>\]]

; Clean disconnect.
3=exit

[RECONCILESSH_PROMPT]
Password=yes

; =============================================================================
; LOGOFF — Shared cleanup sequence appended to each operation on failure.
; =============================================================================

[LOGOFFSSH]
1=exit
