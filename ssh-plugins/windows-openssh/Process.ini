; =============================================================================
; CyberArk CPM Plugin — Windows OpenSSH
; Process.ini
;
; Executes PowerShell cmdlets over SSH to manage Windows local accounts.
; Assumes PowerShell is set as the default OpenSSH shell on the target.
;
; Prompt patterns:
;   PS C:\Users\...>    — PowerShell prompt
;   Windows PowerShell  — startup banner (may appear on first login)
; =============================================================================

[GENERAL]
BackslashUsedAsEscape=No
CommandTimeout=45
ConnectionTimeout=20

; =============================================================================
; VERIFY
; =============================================================================

[VERIFYSSH]
; Connect using the managed account's current credentials.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=PS [A-Z]:\\

; Verify the account is enabled and accessible.
2=Get-LocalUser -Name "%UserName%" | Select-Object -ExpandProperty Enabled
ExpectedOutput2=True

3=exit

[VERIFYSSH_PROMPT]
Password=yes

; =============================================================================
; CHANGE
; =============================================================================

[CHANGESSH]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=PS [A-Z]:\\

; Convert the new password to a SecureString and update the account.
2=Set-LocalUser -Name "%UserName%" -Password (ConvertTo-SecureString -String "%NewPassword%" -AsPlainText -Force)
ExpectedOutput2=PS [A-Z]:\\

; Confirm the account still exists and is enabled after the change.
3=Get-LocalUser -Name "%UserName%" | Select-Object Name, Enabled
ExpectedOutput3=True

4=exit

[CHANGESSH_PROMPT]
Password=yes

; =============================================================================
; RECONCILE
; =============================================================================

[RECONCILESSH]
; Connect as the privileged reconcile account (must be local admin or Domain Admin).
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=PS [A-Z]:\\

; Unlock the account if it got locked out.
2=Unlock-LocalUser -Name "%UserName%" -ErrorAction SilentlyContinue
ExpectedOutput2=PS [A-Z]:\\

; Force-set the managed account to the new password.
3=Set-LocalUser -Name "%UserName%" -Password (ConvertTo-SecureString -String "%NewPassword%" -AsPlainText -Force)
ExpectedOutput3=PS [A-Z]:\\

; Enable the account in case it was disabled.
4=Enable-LocalUser -Name "%UserName%"
ExpectedOutput4=PS [A-Z]:\\

5=exit

[RECONCILESSH_PROMPT]
Password=yes

[LOGOFFSSH]
1=exit
