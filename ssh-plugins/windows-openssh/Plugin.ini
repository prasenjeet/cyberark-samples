; =============================================================================
; CyberArk CPM Plugin — Windows OpenSSH
; Plugin.ini
; =============================================================================

[Main]
CPMPluginVersion=1.0
AllowedSafes=.*
Name=Windows OpenSSH Password Manager

[PolicySettings]
MinValidityPeriod=1
ResetOveridesMinValidity=Yes
ResetOveridesTimeFrame=Yes
HeadStartInterval=5
FromHour=0
ToHour=23
MaxNumberOfRetries=5
MinDelayBetweenRetries=30

[PasswordPolicy]
; Windows local account passwords: avoid characters that break PowerShell
; string literals: single-quote ('), backtick (`), and dollar sign ($).
; Windows also requires meeting the domain/local complexity policy.
AllowedCharacters=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#%^()_+-={}[]:;,.?/!
MinLength=14
MaxLength=20
MinUpperCase=1
MinLowerCase=1
MinDigit=1
MinSpecial=1

[AccountDefinition]
UserName=Required
Address=Required
Port=Optional:22
LogonDomain=Optional

[Capabilities]
CPMChange=Yes
CPMVerify=Yes
CPMReconcile=Yes
