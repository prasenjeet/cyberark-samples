; =============================================================================
; CyberArk CPM Plugin — Custom Application SSH Template
; Process.ini
;
; CUSTOMIZATION GUIDE:
;   1. Run scripts/detect_prompts.sh against your target to capture
;      the exact text that appears at each step.
;   2. Replace every <PROMPT_AFTER_STEPN> placeholder with a regex that
;      matches the captured prompt text.
;   3. Replace every <COMMAND_N> placeholder with the actual command.
;   4. Validate the full sequence with scripts/test_session.sh.
;
; Tips:
;   - ExpectedOutputN is a Java regex evaluated against the SSH output buffer.
;   - Use | for OR alternatives: prompt1|prompt2
;   - Use .* to match anything: .*[Pp]assword.*
;   - Anchors (^ and $) are NOT supported — match substrings only.
;   - Test your regex at: https://regex101.com/ (Java 8 flavor)
; =============================================================================

[GENERAL]
BackslashUsedAsEscape=No
; CUSTOMIZE: Increase if your application is slow to respond.
CommandTimeout=60
ConnectionTimeout=20

; =============================================================================
; VERIFY
; =============================================================================

[VERIFYSSH]
; Step 1: Open an SSH connection using the managed account's credentials.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
; CUSTOMIZE: Replace with the prompt that appears after successful login.
; Examples: "[$#>\\]", "app-shell>", "MainMenu", "Select option"
ExpectedOutput1=<PROMPT_AFTER_LOGIN>

; Step 2: Run a read-only command to confirm access without changing state.
; CUSTOMIZE: Replace with a safe read-only command for your application.
2=<VERIFY_COMMAND>
ExpectedOutput2=<EXPECTED_VERIFY_OUTPUT>

; Step 3: Exit the session cleanly.
; CUSTOMIZE: Replace with your application's logout command.
3=<LOGOUT_COMMAND>

[VERIFYSSH_PROMPT]
Password=yes

; =============================================================================
; CHANGE
; =============================================================================

[CHANGESSH]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=<PROMPT_AFTER_LOGIN>

; CUSTOMIZE: Navigate to the password change area.
; Example for a menu-driven app:
;   2=5           (select option 5 "Security Settings")
;   ExpectedOutput2=Security Menu
;   3=2           (select "Change Password")
;   ExpectedOutput3=Enter current password
2=<NAVIGATE_TO_PASSWORD_CHANGE_STEP1>
ExpectedOutput2=<PROMPT_AFTER_STEP2>

3=<NAVIGATE_TO_PASSWORD_CHANGE_STEP2>
ExpectedOutput3=<PROMPT_ASKING_FOR_CURRENT_PASSWORD>

; Supply the current (old) password when prompted.
4=%Password%
ExpectedOutput4=<PROMPT_ASKING_FOR_NEW_PASSWORD>

; Supply the newly generated password.
5=%NewPassword%
ExpectedOutput5=<PROMPT_ASKING_FOR_CONFIRMATION>

; Confirm the new password.
6=%NewPassword%
ExpectedOutput6=<SUCCESS_MESSAGE_OR_RETURN_TO_MENU>

; CUSTOMIZE: Add extra steps if the app requires saving/committing the change.
; 7=save
; ExpectedOutput7=<SAVE_CONFIRMATION>

7=<LOGOUT_COMMAND>

[CHANGESSH_PROMPT]
Password=yes

; =============================================================================
; RECONCILE
; =============================================================================

[RECONCILESSH]
; CUSTOMIZE: Connect as the privileged reconcile account.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=<PROMPT_AFTER_PRIVILEGED_LOGIN>

; CUSTOMIZE: Navigate to admin user management to reset the target account.
; This sequence varies widely by application — some apps have an "admin reset"
; command, others require a different menu path or CLI command.
2=<ADMIN_NAVIGATE_TO_USER_MGMT>
ExpectedOutput2=<ADMIN_USER_MGMT_PROMPT>

3=<ADMIN_SELECT_TARGET_USER_%UserName%>
ExpectedOutput3=<PROMPT_ASKING_FOR_NEW_PASSWORD>

4=%NewPassword%
ExpectedOutput4=<PROMPT_ASKING_FOR_CONFIRMATION>

5=%NewPassword%
ExpectedOutput5=<SUCCESS_MESSAGE>

6=<LOGOUT_COMMAND>

[RECONCILESSH_PROMPT]
Password=yes

[LOGOFFSSH]
1=<LOGOUT_COMMAND>
