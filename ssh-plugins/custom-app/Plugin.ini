; =============================================================================
; CyberArk CPM Plugin — Custom Application SSH Template
; Plugin.ini
;
; CUSTOMIZATION: Replace all <PLACEHOLDER> values with your application's
; specific settings before deploying.
; =============================================================================

[Main]
CPMPluginVersion=1.0
AllowedSafes=.*
; CUSTOMIZE: Set a meaningful name for your application.
Name=Custom Application SSH Password Manager

[PolicySettings]
MinValidityPeriod=1
ResetOveridesMinValidity=Yes
ResetOveridesTimeFrame=Yes
HeadStartInterval=5
FromHour=0
ToHour=23
MaxNumberOfRetries=3
MinDelayBetweenRetries=60

[PasswordPolicy]
; CUSTOMIZE: Adjust AllowedCharacters to match what your application accepts.
; Start restrictive and expand after testing.
AllowedCharacters=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#_+-
MinLength=12
MaxLength=20
MinUpperCase=1
MinLowerCase=1
MinDigit=1
; CUSTOMIZE: Set MinSpecial=0 if the app does not accept special characters.
MinSpecial=1

[AccountDefinition]
UserName=Required
Address=Required
; CUSTOMIZE: Add application-specific properties here.
; Extra properties are passed to Process.ini as %PropertyName% tokens.
Port=Optional:22
AppInstanceName=Optional
; DatabaseName=Optional
; TenantID=Optional

[Capabilities]
CPMChange=Yes
CPMVerify=Yes
CPMReconcile=Yes
