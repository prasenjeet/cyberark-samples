; =============================================================================
; CyberArk CPM Plugin — Cisco IOS SSH
; Process.ini
;
; Handles two account types controlled by the %AccountType% property:
;   LocalUser    — manages "username <user> secret" entries
;   EnableSecret — manages the "enable secret" password
;
; IOS CLI prompt patterns:
;   Router>   — user exec mode
;   Router#   — privileged exec mode
;   Router(config)#  — global configuration mode
; =============================================================================

[GENERAL]
BackslashUsedAsEscape=No
CommandTimeout=30
ConnectionTimeout=15

; =============================================================================
; VERIFY
; =============================================================================

[VERIFYSSH]
; Initiate SSH session using the managed account credentials.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%

; IOS may display a banner before the prompt — wait for user exec or priv prompt.
ExpectedOutput1=[>#]

; If the device lands in user exec mode, enter enable to reach priv mode.
; (Accounts with privilege 15 skip this step and land directly at #.)
2=enable
ExpectedOutput2=(Password:|[>#])

; Supply the enable password if prompted.
3=%EnablePassword%
ExpectedOutput3=#

; Run a harmless show command to confirm privilege access.
4=show version | include IOS
ExpectedOutput4=IOS

5=exit

[VERIFYSSH_PROMPT]
Password=yes

; =============================================================================
; CHANGE (LocalUser account type)
; =============================================================================

[CHANGESSH_LOCALUSER]
; Log in as the managed local user.
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=[>#]

2=enable
ExpectedOutput2=(Password:|#)

3=%EnablePassword%
ExpectedOutput3=#

; Enter global configuration mode.
4=configure terminal
ExpectedOutput4=config

; Update the local username with the new secret.
; IOS "username X secret Y" defaults to Type 9 (scrypt) on IOS-XE 16.6+.
5=username %UserName% secret %NewPassword%
ExpectedOutput5=config

; Write the configuration to NVRAM.
6=end
ExpectedOutput6=#

7=write memory
ExpectedOutput7=OK|Building

8=exit

[CHANGESSH_LOCALUSER_PROMPT]
Password=yes

; =============================================================================
; CHANGE (EnableSecret account type)
; =============================================================================

[CHANGESSH_ENABLESECRET]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %UserName%@%Address%
ExpectedOutput1=[>#]

2=enable
ExpectedOutput2=(Password:|#)

3=%Password%
ExpectedOutput3=#

4=configure terminal
ExpectedOutput4=config

; Rotate the enable secret.
5=enable secret %NewPassword%
ExpectedOutput5=config

6=end
ExpectedOutput6=#

7=write memory
ExpectedOutput7=OK|Building

8=exit

[CHANGESSH_ENABLESECRET_PROMPT]
Password=yes

; =============================================================================
; RECONCILE (LocalUser account type)
; Uses the privileged reconcile account to reset the managed user's password.
; =============================================================================

[RECONCILESSH_LOCALUSER]
; Log in as the privileged reconcile account (must have privilege 15).
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=[>#]

2=enable
ExpectedOutput2=(Password:|#)

3=%ExtraPass1%
ExpectedOutput3=#

4=configure terminal
ExpectedOutput4=config

; Force-set the managed account to the new password.
5=username %UserName% secret %NewPassword%
ExpectedOutput5=config

6=end
ExpectedOutput6=#

7=write memory
ExpectedOutput7=OK|Building

8=exit

[RECONCILESSH_LOCALUSER_PROMPT]
Password=yes

; =============================================================================
; RECONCILE (EnableSecret account type)
; =============================================================================

[RECONCILESSH_ENABLESECRET]
1=#ssh# -T -o StrictHostKeyChecking=no -p %Port% %ExtraPass1Name%@%Address%
ExpectedOutput1=[>#]

2=enable
ExpectedOutput2=(Password:|#)

3=%ExtraPass1%
ExpectedOutput3=#

4=configure terminal
ExpectedOutput4=config

5=enable secret %NewPassword%
ExpectedOutput5=config

6=end
ExpectedOutput6=#

7=write memory
ExpectedOutput7=OK|Building

8=exit

[RECONCILESSH_ENABLESECRET_PROMPT]
Password=yes

[LOGOFFSSH]
1=exit
