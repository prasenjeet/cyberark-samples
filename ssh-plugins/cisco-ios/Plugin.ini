; =============================================================================
; CyberArk CPM Plugin — Cisco IOS SSH
; Plugin.ini
; =============================================================================

[Main]
CPMPluginVersion=1.0
AllowedSafes=.*
Name=Cisco IOS SSH Password Manager

[PolicySettings]
MinValidityPeriod=1
ResetOveridesMinValidity=Yes
ResetOveridesTimeFrame=Yes
HeadStartInterval=5
FromHour=0
ToHour=23
MaxNumberOfRetries=3
MinDelayBetweenRetries=60

[PasswordPolicy]
; IOS rejects passwords containing spaces and some special characters.
; Type 8 (PBKDF2-SHA256) and Type 9 (scrypt) hashing accept all printable chars.
; Type 5 (MD5) — the legacy default — rejects some high-bit characters.
AllowedCharacters=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#%^()_+-={}[]:;,.?/
MinLength=12
MaxLength=25
MinUpperCase=1
MinLowerCase=1
MinDigit=1
MinSpecial=1

[AccountDefinition]
UserName=Required
Address=Required
Port=Optional:22
AccountType=Optional:LocalUser
; EnablePassword is needed when the reconcile account is not priv-15 at login.
EnablePassword=Optional

[Capabilities]
CPMChange=Yes
CPMVerify=Yes
CPMReconcile=Yes
